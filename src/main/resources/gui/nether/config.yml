# =====================================================================
#   DimensionToggle - Nether GUI
# =====================================================================
# Every text shown in the Nether control panel and its sub-menus (player
# list, maintenance, schedule, mob management, world border), fully
# editable/translatable. Placeholders where noted. Full MiniMessage is
# supported (gradients, small caps via Unicode) alongside classic & codes.

# ---------- Control panel ----------
control-panel:
  title: "<gradient:#FF6B4A:#C81E1E><bold>ɴᴇᴛʜᴇʀ</bold></gradient> <dark_gray>| <gray>ᴄᴏɴᴛʀᴏʟ ᴘᴀɴᴇʟ"

  toggle-button:
    name-enabled: "<gradient:#4ADE80:#16A34A><bold>✔ Enabled</bold></gradient>"
    name-disabled: "<gray>✖ Disabled"
    lore: "<gray>Click to %action% the Nether"

  softlock-button:
    name-locked: "<gradient:#FBBF24:#D97706><bold>⚠ Soft-Locked</bold></gradient>"
    name-unlocked: "<gray>Soft-Lock: Off"
    lore:
      - "<gray>No new arrivals while locked;"
      - "<gray>players already inside can stay."
      - ""
      - "<gold>➤ <gray>Click to %action%"

  playerlist-button:
    name: "<aqua><bold>Players Inside <white>(%count%)"
    lore:
      - "<gray>Click to see who's in the Nether"
      - "<gray>and teleport to them."

  keepinventory-button:
    name-on: "<gradient:#4ADE80:#16A34A><bold>✔ Keep Inventory: On</bold></gradient>"
    name-off: "<gray>✖ Keep Inventory: Off"
    lore:
      - "<gray>Players keep their items"
      - "<gray>on death in the Nether."
      - ""
      - "<gold>➤ <gray>Click to toggle"

  limit-button:
    name: "<gold><bold>Player Limit"
    lore:
      - "<gray>Limit is currently %limit-status%"
      - "<gray>Current: <white>%limit% <gray>players"
      - ""
      - "<gold>Left-click: <white>-1  <gold>Shift-Left: <white>-10"
      - "<gold>Right-click: <white>+1  <gold>Shift-Right: <white>+10"

  maintenance-button:
    name: "<gradient:#FBBF24:#D97706><bold>Maintenance</bold></gradient>"
    lore:
      - "<gray>Start a countdown, then close"
      - "<gray>the Nether and remove everyone inside."
      - ""
      - "<gold>➤ <gray>Click to open"

  schedule-button:
    name: "<aqua><bold>Schedule"
    lore:
      - "<gray>Automatic daily open/close times."
      - ""
      - "<gold>➤ <gray>Click to open"

  mobmanagement-button:
    name: "<gradient:#4ADE80:#16A34A><bold>Mob Management</bold></gradient>"
    lore:
      - "<gray>Toggle spawning per mob type,"
      - "<gray>and set automatic cleanup intervals."
      - ""
      - "<gold>➤ <gray>Click to open"

  mobspawn-button:
    name-on: "<gradient:#4ADE80:#16A34A><bold>✔ Mob Spawning: On</bold></gradient>"
    name-off: "<gray>✖ Mob Spawning: Off"
    lore:
      - "<gray>Whether ANY mob can spawn at all"
      - "<gray>in the Nether (vanilla doMobSpawning)."
      - ""
      - "<gold>➤ <gray>Click to toggle"

  worldborder-button:
    name: "<aqua><bold>World Border"
    lore:
      - "<gray>Adjust how far the Nether"
      - "<gray>extends from its center."
      - ""
      - "<gold>➤ <gray>Click to open"

  pvp-button:
    name-on: "<gradient:#4ADE80:#16A34A><bold>✔ PvP: On</bold></gradient>"
    name-off: "<gray>✖ PvP: Off"
    name-unavailable: "<dark_gray>PvP: Unavailable"
    lore-available:
      - "<gray>Whether players can fight each"
      - "<gray>other in the Nether."
      - ""
      - "<gold>➤ <gray>Click to toggle"
    lore-unavailable:
      - "<red>Requires the 'PvPManager' plugin"
      - "<red>to be installed on this server."

  spawners-button:
    name-on: "<gradient:#4ADE80:#16A34A><bold>✔ Spawners: On</bold></gradient>"
    name-off: "<gray>✖ Spawners: Off"
    lore:
      - "<gray>Whether monster spawner blocks"
      - "<gray>function in the Nether."
      - ""
      - "<gold>➤ <gray>Click to toggle"

  back-button:
    name: "<dark_gray>« <gray>Back"
    lore: "<gray>Return to the main menu"

  dashboard:
    title: "<gradient:#FF6B4A:#C81E1E><bold>Dashboard</bold></gradient> <dark_gray>- <gray>Nether"
    peak-players: "<gray>Peak players seen: <white>%peak%"
    world-border: "<gray>World border size: <white>%size%"
    loaded-chunks: "<gray>Loaded chunks: <white>%chunks%"
    entities-header: "<dark_gray>Top entities in this dimension:"
    entity-line: "<gray> - %type%: <white>%count%"
    world-not-loaded: "<gray>(World not loaded)"
    server-wide-header: "<dark_gray>Server-wide (not dimension-specific):"
    tps-line: "<gray>TPS: <white>%tps%"

# Words used above for %action% / %limit-status%
action-enable: "enable"
action-disable: "disable"
action-lock: "soft-lock"
action-unlock: "unlock"
limit-status-enabled: "<green>enabled"
limit-status-disabled: "<gray>disabled"

# ---------- Player list sub-menu ----------
playerlist:
  title: "<gradient:#FF6B4A:#C81E1E><bold>ᴘʟᴀʏᴇʀꜱ</bold></gradient> <dark_gray>| <gray>Nether"
  empty-message: "<gray>Nobody is currently in the Nether"
  head-lore: "<gold>➤ <gray>Click to teleport to this player"
  back-button:
    name: "<dark_gray>« <gray>Back"
    lore: "<gray>Return to the Nether's control panel"

# ---------- Maintenance sub-menu ----------
maintenance:
  title: "<gradient:#FF6B4A:#C81E1E><bold>ᴍᴀɪɴᴛᴇɴᴀɴᴄᴇ</bold></gradient> <dark_gray>| <gray>Nether"
  preset-lore: "<gray>Start a <white>%preset% <gray>countdown for the Nether"
  status-active: "<gradient:#FBBF24:#D97706><bold>⏱ Countdown Running</bold></gradient>"
  status-active-lore: "<gray>Nether closes in <white>%seconds%s"
  status-idle: "<gray>No Countdown Running"
  status-idle-lore: "<gray>Pick a preset below to start one."
  custom-button:
    name: "<aqua><bold>Custom Time"
    lore:
      - "<gray>Click, then rename the item to any"
      - "<gray>duration (e.g. 1h30m, 45m, 2h)"
      - "<gray>and click it again to confirm."
  cancel-button:
    name: "<red><bold>Cancel Countdown"
    lore:
      - "<gray>A countdown is running: <white>%seconds%s <gray>left"
      - ""
      - "<gold>➤ <gray>Click to cancel it"
  back-button:
    name: "<dark_gray>« <gray>Back"
    lore: "<gray>Return to the Nether's control panel"

# ---------- Schedule sub-menu ----------
schedule:
  title: "<gradient:#FF6B4A:#C81E1E><bold>ꜱᴄʜᴇᴅᴜʟᴇ</bold></gradient> <dark_gray>| <gray>Nether"
  toggle-button:
    name-on: "<gradient:#4ADE80:#16A34A><bold>✔ Schedule: On</bold></gradient>"
    name-off: "<gray>✖ Schedule: Off"
    lore:
      - "<gray>Open: <white>%open-time%  <gray>Close: <white>%close-time%"
      - ""
      - "<gold>➤ <gray>Click to toggle the whole schedule"
  open-time-header: "<gradient:#4ADE80:#16A34A><bold>Pick an OPEN time</bold></gradient>"
  open-time-lore: "<gray>Set the opening time to <white>%time%"
  close-time-header: "<gradient:#F87171:#DC2626><bold>Pick a CLOSE time</bold></gradient>"
  close-time-lore: "<gray>Set the closing time to <white>%time%"
  countdown-button:
    name-on: "<gradient:#4ADE80:#16A34A><bold>✔ Countdown: On</bold></gradient>"
    name-off: "<gray>✖ Countdown: Off"
    lore:
      - "<gray>Whether a countdown warning is shown"
      - "<gray>before opening/closing automatically."
      - ""
      - "<gold>➤ <gray>Click to toggle"
  back-button:
    name: "<dark_gray>« <gray>Back"
    lore: "<gray>Return to the Nether's control panel"

# ---------- Mob management sub-menu ----------
mob-management:
  title: "<gradient:#FF6B4A:#C81E1E><bold>ᴍᴏʙ ᴍᴀɴᴀɢᴇᴍᴇɴᴛ</bold></gradient> <dark_gray>| <gray>Nether"
  mob-name-enabled: "<green>%mob%"
  mob-name-disabled: "<gray>%mob%"
  status-spawning-allowed: "<gray>Spawning: <green>allowed"
  status-spawning-blocked: "<gray>Spawning: <red>blocked"
  cleanup-off: "<gray>Auto-cleanup: <gray>off"
  cleanup-active: "<gray>Auto-cleanup: <white>every %minutes%m"
  cleanup-next: "<gray>Next cleanup in: <gold>%next%m"
  mob-lore-hint:
    - ""
    - "<gold>Click: <gray>toggle spawning"
    - "<gold>Shift-click: <gray>cycle cleanup interval"
  back-button:
    name: "<dark_gray>« <gray>Back"
    lore: "<gray>Return to the Nether's control panel"

# ---------- World border sub-menu ----------
worldborder:
  title: "<gradient:#FF6B4A:#C81E1E><bold>ᴡᴏʀʟᴅ ʙᴏʀᴅᴇʀ</bold></gradient> <dark_gray>| <gray>Nether"
  adjust-button:
    name: "<aqua><bold>Diameter: <white>%size%"
    lore:
      - "<gray>Center: <white>%center-x%<gray>, <white>%center-z%"
      - ""
      - "<gold>Left-click: <white>-100  <gold>Shift-Left: <white>-1000"
      - "<gold>Right-click: <white>+100  <gold>Shift-Right: <white>+1000"
  preset-name: "<gold>%size%"
  preset-lore: "<gray>Set the border diameter to <white>%size%"
  center-button:
    name: "<aqua><bold>Center at 0, 0"
    lore:
      - "<gray>Moves the border's center"
      - "<gray>back to the world origin."
  back-button:
    name: "<dark_gray>« <gray>Back"
    lore: "<gray>Return to the Nether's control panel"
