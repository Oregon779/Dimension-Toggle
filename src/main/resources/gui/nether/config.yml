# =====================================================================
#   DimensionToggle - Nether menus
# =====================================================================
# Every text of these menus, fully editable. Placeholders where noted.
# MiniMessage (gradients, <#hex> colors, small caps via Unicode) and
# classic & codes can be mixed freely.
# Look: the theme color of this area is red/orange; green = on, red = off,
# yellow lines tell what a click does.

# ---------- Control panel ----------
control-panel:
  title: "<gradient:#FB923C:#DC2626><bold>ɴᴇᴛʜᴇʀ</bold></gradient> <dark_gray>» <gray>ᴄᴏɴᴛʀᴏʟ ᴘᴀɴᴇʟ"

  toggle-button:
    name-enabled: "<#4ADE80><bold>● Nether is OPEN</bold>"
    name-disabled: "<#F87171><bold>● Nether is CLOSED</bold>"
    lore:
      - "<dark_gray>ᴀᴄᴄᴇꜱꜱ"
      - ""
      - "<gray>Opens or closes the portals to"
      - "<gray>the Nether. Closing sends everyone"
      - "<gray>inside back to the spawn."
      - ""
      - "<#FCD34D>▸ Click <dark_gray>» <gray>%action% the Nether"

  softlock-button:
    name-locked: "<#FBBF24><bold>● Soft-Lock ON</bold>"
    name-unlocked: "<gray><bold>Soft-Lock</bold> <dark_gray>│ <#F87171>● Off"
    lore:
      - "<dark_gray>ᴀᴄᴄᴇꜱꜱ"
      - ""
      - "<gray>No new arrivals - players who are"
      - "<gray>already inside may stay."
      - ""
      - "<#FCD34D>▸ Click <dark_gray>» <gray>%action%"

  limit-button:
    name: "<gradient:#FB923C:#DC2626><bold>Player Limit</bold></gradient>"
    lore:
      - "<dark_gray>ᴀᴄᴄᴇꜱꜱ"
      - ""
      - "<gray>Limit <dark_gray>» %limit-status%"
      - "<gray>Max players <dark_gray>» <white>%limit%"
      - ""
      - "<#FCD34D>▸ Left-click <dark_gray>» <gray>-1"
      - "<#FCD34D>▸ Right-click <dark_gray>» <gray>+1"
      - "<#FCD34D>▸ Shift <dark_gray>» <gray>-10 / +10"

  playerlist-button:
    name: "<aqua><bold>Players Inside</bold> <dark_gray>│ <white>%count%"
    lore:
      - "<dark_gray>ᴀᴄᴄᴇꜱꜱ"
      - ""
      - "<gray>Who is in the Nether right now -"
      - "<gray>click a head to teleport there."
      - ""
      - "<#FCD34D>▸ Click <dark_gray>» <gray>show the list"

  maintenance-button:
    name: "<gradient:#FBBF24:#D97706><bold>Maintenance</bold></gradient>"
    lore:
      - "<dark_gray>ᴀᴜᴛᴏᴍᴀᴛɪᴏɴ"
      - ""
      - "<gray>Countdown, then the Nether closes"
      - "<gray>and everyone inside is sent out."
      - ""
      - "<#FCD34D>▸ Click <dark_gray>» <gray>open"

  schedule-button:
    name: "<aqua><bold>Schedule</bold>"
    lore:
      - "<dark_gray>ᴀᴜᴛᴏᴍᴀᴛɪᴏɴ"
      - ""
      - "<gray>Open and close the Nether"
      - "<gray>automatically every day."
      - ""
      - "<#FCD34D>▸ Click <dark_gray>» <gray>open"

  keepinventory-button:
    name-on: "<white><bold>Keep Inventory</bold> <dark_gray>│ <#4ADE80>● On"
    name-off: "<white><bold>Keep Inventory</bold> <dark_gray>│ <#F87171>● Off"
    lore:
      - "<dark_gray>ʀᴜʟᴇꜱ"
      - ""
      - "<gray>Players keep their items when"
      - "<gray>they die in the Nether."
      - ""
      - "<#FCD34D>▸ Click <dark_gray>» <gray>toggle"

  pvp-button:
    name-on: "<white><bold>PvP</bold> <dark_gray>│ <#4ADE80>● On"
    name-off: "<white><bold>PvP</bold> <dark_gray>│ <#F87171>● Off"
    name-unavailable: "<dark_gray><bold>PvP</bold> │ not available"
    lore-available:
      - "<dark_gray>ʀᴜʟᴇꜱ"
      - ""
      - "<gray>Whether players can fight each"
      - "<gray>other in the Nether."
      - ""
      - "<#FCD34D>▸ Click <dark_gray>» <gray>toggle"
    lore-unavailable:
      - "<dark_gray>ʀᴜʟᴇꜱ"
      - ""
      - "<#F87171>Needs the PvPManager plugin."

  mobspawn-button:
    name-on: "<white><bold>Mob Spawning</bold> <dark_gray>│ <#4ADE80>● On"
    name-off: "<white><bold>Mob Spawning</bold> <dark_gray>│ <#F87171>● Off"
    lore:
      - "<dark_gray>ʀᴜʟᴇꜱ"
      - ""
      - "<gray>Whether any mob spawns naturally"
      - "<gray>in the Nether (gamerule spawn_mobs)."
      - ""
      - "<#FCD34D>▸ Click <dark_gray>» <gray>toggle"

  spawners-button:
    name-on: "<white><bold>Spawners</bold> <dark_gray>│ <#4ADE80>● On"
    name-off: "<white><bold>Spawners</bold> <dark_gray>│ <#F87171>● Off"
    lore:
      - "<dark_gray>ʀᴜʟᴇꜱ"
      - ""
      - "<gray>Whether monster spawner blocks"
      - "<gray>work in the Nether."
      - ""
      - "<#FCD34D>▸ Click <dark_gray>» <gray>toggle"

  mobmanagement-button:
    name: "<gradient:#4ADE80:#16A34A><bold>Mob Management</bold></gradient>"
    lore:
      - "<dark_gray>ᴍᴀɴᴀɢᴇᴍᴇɴᴛ"
      - ""
      - "<gray>Allow or block each mob type and"
      - "<gray>set automatic cleanups."
      - ""
      - "<#FCD34D>▸ Click <dark_gray>» <gray>open"

  worldborder-button:
    name: "<aqua><bold>World Border</bold>"
    lore:
      - "<dark_gray>ᴍᴀɴᴀɢᴇᴍᴇɴᴛ"
      - ""
      - "<gray>How far the Nether reaches"
      - "<gray>from its center."
      - ""
      - "<#FCD34D>▸ Click <dark_gray>» <gray>open"

  back-button:
    name: "<gray>« <white>Back"
    lore:
      - "<dark_gray>Return to the main menu"

  dashboard:
    title: "<gradient:#FB923C:#DC2626><bold>Nether</bold></gradient> <dark_gray>» <gray>Overview"
    peak-players: "<gray>Player record <dark_gray>» <white>%peak%"
    world-border: "<gray>World border <dark_gray>» <white>%size%"
    loaded-chunks: "<gray>Loaded chunks <dark_gray>» <white>%chunks%"
    entities-header: "<dark_gray>ᴍᴏꜱᴛ ᴄᴏᴍᴍᴏɴ ᴇɴᴛɪᴛɪᴇꜱ"
    entity-line: "<dark_gray> ▪ <gray>%type% <dark_gray>» <white>%count%"
    world-not-loaded: "<gray>(world not loaded)"
    server-wide-header: "<dark_gray>ᴡʜᴏʟᴇ ꜱᴇʀᴠᴇʀ"
    tps-line: "<gray>TPS <dark_gray>» <white>%tps%"

# Words used above for %action% / %limit-status%
action-enable: "open"
action-disable: "close"
action-lock: "switch on"
action-unlock: "switch off"
limit-status-enabled: "<#4ADE80>● active"
limit-status-disabled: "<#F87171>● off"

# ---------- Player list ----------
playerlist:
  title: "<gradient:#FB923C:#DC2626><bold>ᴘʟᴀʏᴇʀꜱ</bold></gradient> <dark_gray>» <gray>Nether"
  empty-message: "<gray>Nobody is in the Nether right now"
  head-name: "<white><bold>%player%</bold>"
  head-lore:
    - "<#FCD34D>▸ Click <dark_gray>» <gray>teleport to %player%"
  back-button:
    name: "<gray>« <white>Back"
    lore:
      - "<dark_gray>Return to the Nether's control panel"

# ---------- Maintenance ----------
maintenance:
  title: "<gradient:#FB923C:#DC2626><bold>ᴍᴀɪɴᴛᴇɴᴀɴᴄᴇ</bold></gradient> <dark_gray>» <gray>Nether"
  preset-name: "<#FBBF24><bold>%preset%</bold>"
  preset-lore: "<gray>Close the Nether in <white>%preset%"
  status-active: "<gradient:#FBBF24:#D97706><bold>⏱ Countdown running</bold></gradient>"
  status-active-lore: "<gray>The Nether closes in <white>%seconds%s"
  status-idle: "<gray><bold>No countdown running</bold>"
  status-idle-lore: "<dark_gray>Pick a time below to start one."
  # Title of the anvil that opens for the custom time
  custom-title: "<aqua><bold>Custom time</bold> <dark_gray>» <gray>e.g. 1h30m"
  custom-button:
    name: "<aqua><bold>Custom time</bold>"
    lore:
      - "<gray>Any duration, e.g. <white>45m<gray>, <white>2h<gray>, <white>1h30m"
      - ""
      - "<#FCD34D>▸ Click <dark_gray>» <gray>type it in an anvil"
  cancel-button:
    name: "<#F87171><bold>Cancel countdown</bold>"
    lore:
      - "<gray><white>%seconds%s <gray>left"
      - ""
      - "<#FCD34D>▸ Click <dark_gray>» <gray>cancel"
  back-button:
    name: "<gray>« <white>Back"
    lore:
      - "<dark_gray>Return to the Nether's control panel"

# ---------- Schedule ----------
schedule:
  title: "<gradient:#FB923C:#DC2626><bold>ꜱᴄʜᴇᴅᴜʟᴇ</bold></gradient> <dark_gray>» <gray>Nether"
  toggle-button:
    name-on: "<white><bold>Schedule</bold> <dark_gray>│ <#4ADE80>● On"
    name-off: "<white><bold>Schedule</bold> <dark_gray>│ <#F87171>● Off"
    lore:
      - "<gray>Opens <dark_gray>» <white>%open-time%"
      - "<gray>Closes <dark_gray>» <white>%close-time%"
      - ""
      - "<#FCD34D>▸ Click <dark_gray>» <gray>toggle"
  countdown-button:
    name-on: "<white><bold>Countdown</bold> <dark_gray>│ <#4ADE80>● On"
    name-off: "<white><bold>Countdown</bold> <dark_gray>│ <#F87171>● Off"
    lore:
      - "<gray>Warn players before the Nether"
      - "<gray>opens or closes automatically."
      - ""
      - "<#FCD34D>▸ Click <dark_gray>» <gray>toggle"
  open-time-header: "<#4ADE80><bold>▼ Opening time</bold>"
  open-time-header-lore:
    - "<gray>Now <dark_gray>» <white>%open-time%"
  open-time-name: "<#4ADE80><bold>%time%</bold>"
  open-time-lore: "<gray>Open the Nether at <white>%time%"
  close-time-header: "<#F87171><bold>▼ Closing time</bold>"
  close-time-header-lore:
    - "<gray>Now <dark_gray>» <white>%close-time%"
  close-time-name: "<#F87171><bold>%time%</bold>"
  close-time-lore: "<gray>Close the Nether at <white>%time%"
  back-button:
    name: "<gray>« <white>Back"
    lore:
      - "<dark_gray>Return to the Nether's control panel"

# ---------- Mob management ----------
mob-management:
  title: "<gradient:#FB923C:#DC2626><bold>ᴍᴏʙꜱ</bold></gradient> <dark_gray>» <gray>Nether"
  mob-name-enabled: "<#4ADE80><bold>%mob%</bold>"
  mob-name-disabled: "<#F87171><bold>%mob%</bold>"
  status-spawning-allowed: "<gray>Spawning <dark_gray>» <#4ADE80>● allowed"
  status-spawning-blocked: "<gray>Spawning <dark_gray>» <#F87171>● blocked"
  cleanup-off: "<gray>Auto-cleanup <dark_gray>» <gray>off"
  cleanup-active: "<gray>Auto-cleanup <dark_gray>» <white>every %interval%"
  cleanup-next: "<gray>Next cleanup <dark_gray>» <#FBBF24>in %next%"
  mob-lore-hint:
    - ""
    - "<#FCD34D>▸ Click <dark_gray>» <gray>spawning on/off"
    - "<#FCD34D>▸ Shift-click <dark_gray>» <gray>cleanup: off/5/10/30/60 min"
    - "<#FCD34D>▸ Right-click <dark_gray>» <gray>own cleanup time (chat)"
  back-button:
    name: "<gray>« <white>Back"
    lore:
      - "<dark_gray>Return to the Nether's control panel"

# ---------- World border ----------
worldborder:
  title: "<gradient:#FB923C:#DC2626><bold>ᴡᴏʀʟᴅ ʙᴏʀᴅᴇʀ</bold></gradient> <dark_gray>» <gray>Nether"
  adjust-button:
    name: "<aqua><bold>Diameter</bold> <dark_gray>│ <white>%size%"
    lore:
      - "<gray>Center <dark_gray>» <white>%center-x%<gray>, <white>%center-z%"
      - ""
      - "<#FCD34D>▸ Left-click <dark_gray>» <gray>-100"
      - "<#FCD34D>▸ Right-click <dark_gray>» <gray>+100"
      - "<#FCD34D>▸ Shift <dark_gray>» <gray>-1000 / +1000"
  preset-name: "<#FBBF24><bold>%size%</bold>"
  preset-lore: "<gray>Set the diameter to <white>%size%"
  center-button:
    name: "<aqua><bold>Center at 0, 0</bold>"
    lore:
      - "<gray>Moves the border's center back"
      - "<gray>to the world origin."
  back-button:
    name: "<gray>« <white>Back"
    lore:
      - "<dark_gray>Return to the Nether's control panel"
