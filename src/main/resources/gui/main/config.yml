# =====================================================================
#   DimensionToggle - Main GUI
# =====================================================================
# Every text shown in the main menu (/dt editor), fully editable/translatable.
# Placeholders where noted. Full MiniMessage is supported here (gradients,
# small caps via Unicode, etc.) alongside classic & color codes.

title: "<gradient:#A78BFA:#7C3AED><bold>ᴅɪᴍᴇɴꜱɪᴏɴ ᴛᴏɢɢʟᴇ</bold></gradient> <dark_gray>| <gray>ᴀᴅᴍɪɴ ᴇᴅɪᴛᴏʀ"

nether-head:
  name: "<gradient:#FF6B4A:#C81E1E><bold>Nether</bold></gradient>"
  lore:
    - "<gray>Status: %status%"
    - ""
    - "<gold>➤ <gray>Click to manage this dimension"

end-head:
  name: "<gradient:#C084FC:#EC4899><bold>End</bold></gradient>"
  lore:
    - "<gray>Status: %status%"
    - ""
    - "<gold>➤ <gray>Click to manage this dimension"

emblem:
  name: "<gradient:#A78BFA:#7C3AED><bold>Dimension Toggle</bold></gradient>"
  lore:
    - "<dark_gray>A plugin by Stone Plugins"

lockdown-button:
  name-active: "<gradient:#F87171:#DC2626><bold>⚠ Lift Lockdown</bold></gradient>"
  name-inactive: "<gray><bold>Lockdown"
  lore-active:
    - "<gray>Lockdown is currently <red><bold>ACTIVE</bold><gray>."
    - ""
    - "<gold>➤ <gray>Click to lift the lockdown"
  lore-inactive:
    - "<gray>Instantly disables both dimensions."
    - ""
    - "<gold>➤ <gray>Click to activate lockdown"

close-button:
  name: "<red><bold>Close"
  lore:
    - "<gray>Leave this menu"

# Words used for %status% above
status-enabled: "<gradient:#4ADE80:#16A34A><bold>✔ Enabled</bold></gradient>"
status-disabled: "<gray>✖ Disabled"
