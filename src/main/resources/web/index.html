<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DimensionToggle · Performance</title>
<style>
  :root { --bg:#0f1117; --card:#181b24; --line:#262a36; --text:#e6e8ee; --muted:#8b91a3;
          --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --accent:#a78bfa; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:20px 16px 8px; max-width:1100px; margin:0 auto; display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { margin:0; font-size:22px; } h1 span { color:var(--accent); }
  #updated { color:var(--muted); font-size:13px; }
  main { max-width:1100px; margin:0 auto; padding:8px 16px 32px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .value { font-size:26px; font-weight:650; margin-top:2px; }
  .sub { color:var(--muted); font-size:13px; }
  .good { color:var(--good); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  h2 { font-size:15px; margin:22px 0 10px; color:var(--muted); font-weight:600; }
  canvas { width:100%; height:220px; display:block; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; padding:1px 9px; border-radius:99px; font-size:12px; border:1px solid currentColor; }
  .legend { display:flex; gap:16px; font-size:13px; color:var(--muted); margin-bottom:6px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
  .scroll { overflow-x:auto; }
  #error { display:none; color:var(--bad); margin:12px 0; }
</style>
</head>
<body>
<header>
  <h1>DimensionToggle <span>· Performance</span></h1>
  <div id="updated"></div>
</header>
<main>
  <div id="error"></div>
  <div class="grid">
    <div class="card"><div class="label" data-t="tps">TPS</div><div class="value" id="tps">–</div><div class="sub" id="tpsSub"></div></div>
    <div class="card"><div class="label" data-t="mspt">MSPT</div><div class="value" id="mspt">–</div><div class="sub" id="msptSub"></div></div>
    <div class="card"><div class="label" data-t="players">Players</div><div class="value" id="players">–</div></div>
    <div class="card"><div class="label" data-t="memory">Memory</div><div class="value" id="memory">–</div><div class="sub" id="memorySub"></div></div>
    <div class="card"><div class="label" data-t="cpu">CPU</div><div class="value" id="cpu">–</div></div>
    <div class="card"><div class="label" data-t="uptime">Uptime</div><div class="value" id="uptime">–</div><div class="sub" id="auto"></div></div>
  </div>

  <h2 data-t="history">Last hour</h2>
  <div class="card">
    <div class="legend"><span><i style="background:#a78bfa"></i>MSPT</span><span><i style="background:#4ade80"></i>TPS</span></div>
    <canvas id="chart"></canvas>
  </div>

  <h2 data-t="dimensions">Dimensions</h2>
  <div class="grid" id="dimensions"></div>

  <h2 data-t="worlds">Worlds</h2>
  <div class="card scroll"><table>
    <thead><tr><th data-t="world">World</th><th class="num" data-t="players">Players</th><th class="num" data-t="chunks">Chunks</th><th class="num" data-t="entities">Entities</th><th class="num" data-t="blockEntities">Block entities</th></tr></thead>
    <tbody id="worlds"></tbody>
  </table></div>

  <h2 data-t="topChunks">Busiest chunks</h2>
  <div class="card scroll"><table>
    <thead><tr><th data-t="world">World</th><th data-t="chunk">Chunk</th><th class="num" data-t="entities">Entities</th><th class="num" data-t="mobs">Mobs</th><th class="num" data-t="items">Items</th><th class="num" data-t="score">Score</th></tr></thead>
    <tbody id="chunks"></tbody>
  </table></div>
</main>
<script>
(function () {
  var T = {
    en: { tps:"TPS", mspt:"MSPT", players:"Players", memory:"Memory", cpu:"CPU", uptime:"Uptime", history:"Last hour",
          dimensions:"Dimensions", worlds:"Worlds", world:"World", chunks:"Chunks", entities:"Entities",
          blockEntities:"Block entities", topChunks:"Busiest chunks", chunk:"Chunk", mobs:"Mobs", items:"Items",
          score:"Score", updated:"Updated", peak:"peak", avg:"1m / 5m / 15m", auto:"Auto performance mode active",
          enabled:"Open", disabled:"Closed", locked:"Soft-locked", maintenance:"Maintenance running",
          nether:"Nether", end:"End", none:"Nothing to show yet", offline:"Connection lost - retrying …" },
    de: { tps:"TPS", mspt:"MSPT", players:"Spieler", memory:"Arbeitsspeicher", cpu:"CPU", uptime:"Laufzeit",
          history:"Letzte Stunde", dimensions:"Dimensionen", worlds:"Welten", world:"Welt", chunks:"Chunks",
          entities:"Entities", blockEntities:"Block-Entities", topChunks:"Vollste Chunks", chunk:"Chunk",
          mobs:"Mobs", items:"Items", score:"Score", updated:"Aktualisiert", peak:"Spitze", avg:"1m / 5m / 15m",
          auto:"Auto-Performance-Modus aktiv", enabled:"Offen", disabled:"Geschlossen", locked:"Soft-Lock",
          maintenance:"Wartung läuft", nether:"Nether", end:"End", none:"Noch keine Daten",
          offline:"Verbindung verloren – neuer Versuch …" }
  };
  var lang = "en";
  var token = new URLSearchParams(location.search).get("token") || "";
  function t(key) { return (T[lang] && T[lang][key]) || T.en[key] || key; }
  function el(id) { return document.getElementById(id); }
  function cls(value, good, warn, higherIsBetter) {
    if (higherIsBetter) return value >= good ? "good" : value >= warn ? "warn" : "bad";
    return value <= good ? "good" : value <= warn ? "warn" : "bad";
  }
  function setValue(id, text, css) { var e = el(id); e.textContent = text; e.className = "value " + (css || ""); }
  function cell(row, text, num) { var td = document.createElement("td"); td.textContent = text; if (num) td.className = "num"; row.appendChild(td); }
  function duration(s) {
    var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    return (d ? d + "d " : "") + (h ? h + "h " : "") + m + "m";
  }
  function translate() {
    document.documentElement.lang = lang;
    var nodes = document.querySelectorAll("[data-t]");
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = t(nodes[i].getAttribute("data-t"));
  }
  function drawChart(mspt, tps) {
    var canvas = el("chart"), ratio = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * ratio; canvas.height = h * ratio;
    var ctx = canvas.getContext("2d"); ctx.scale(ratio, ratio); ctx.clearRect(0, 0, w, h);
    var pad = 28, maxMspt = 60;
    for (var i = 0; i < mspt.length; i++) maxMspt = Math.max(maxMspt, mspt[i]);
    ctx.strokeStyle = "#262a36"; ctx.fillStyle = "#8b91a3"; ctx.font = "11px system-ui"; ctx.lineWidth = 1;
    [0, 0.5, 1].forEach(function (f) {
      var y = pad / 2 + (h - pad) * (1 - f);
      ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w, y); ctx.stroke();
      ctx.fillText(Math.round(maxMspt * f) + "ms", 0, y + 4);
    });
    var limitY = pad / 2 + (h - pad) * (1 - 50 / maxMspt);
    ctx.strokeStyle = "rgba(248,113,113,.5)"; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(pad, limitY); ctx.lineTo(w, limitY); ctx.stroke(); ctx.setLineDash([]);
    function line(values, max, color) {
      if (values.length < 2) return;
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
      for (var i = 0; i < values.length; i++) {
        var x = pad + (w - pad) * i / (values.length - 1);
        var y = pad / 2 + (h - pad) * (1 - Math.min(values[i], max) / max);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    line(mspt, maxMspt, "#a78bfa");
    line(tps, 20, "#4ade80");
  }
  function render(d) {
    if (d.language && T[d.language] && d.language !== lang) { lang = d.language; translate(); }
    setValue("tps", d.tps1.toFixed(1), cls(d.tps1, 19.5, 17, true));
    el("tpsSub").textContent = t("avg") + ": " + d.tps1.toFixed(1) + " / " + d.tps5.toFixed(1) + " / " + d.tps15.toFixed(1);
    setValue("mspt", d.mspt.toFixed(1), cls(d.mspt, 40, 50, false));
    el("msptSub").textContent = t("peak") + ": " + d.msptMax.toFixed(1) + " ms";
    setValue("players", d.online + " / " + d.maxPlayers);
    var memPct = d.memoryMaxMb > 0 ? d.memoryUsedMb / d.memoryMaxMb * 100 : 0;
    setValue("memory", Math.round(memPct) + "%", cls(memPct, 75, 90, false));
    el("memorySub").textContent = d.memoryUsedMb + " / " + d.memoryMaxMb + " MB";
    setValue("cpu", d.cpuPercent < 0 ? "–" : Math.round(d.cpuPercent) + "%", d.cpuPercent < 0 ? "" : cls(d.cpuPercent, 70, 90, false));
    setValue("uptime", duration(d.uptimeSeconds));
    el("auto").textContent = d.autoPerformance ? t("auto") : "";
    el("auto").className = "sub " + (d.autoPerformance ? "warn" : "");

    var dims = el("dimensions"); dims.innerHTML = "";
    Object.keys(d.dimensions).forEach(function (key) {
      var state = d.dimensions[key], card = document.createElement("div"); card.className = "card";
      var label = document.createElement("div"); label.className = "label"; label.textContent = t(key);
      var pill = document.createElement("span"); pill.className = "pill " + (state === "enabled" ? "good" : state === "disabled" ? "bad" : "warn");
      pill.textContent = t(state); card.appendChild(label); card.appendChild(pill); dims.appendChild(card);
    });

    var worlds = el("worlds"); worlds.innerHTML = "";
    d.worlds.forEach(function (w) {
      var row = document.createElement("tr");
      cell(row, w.name); cell(row, w.players, true); cell(row, w.chunks, true); cell(row, w.entities, true); cell(row, w.blockEntities, true);
      worlds.appendChild(row);
    });

    var chunks = el("chunks"); chunks.innerHTML = "";
    if (!d.topChunks.length) {
      var empty = document.createElement("tr"); var td = document.createElement("td"); td.colSpan = 6; td.className = "sub";
      td.textContent = t("none"); empty.appendChild(td); chunks.appendChild(empty);
    }
    d.topChunks.forEach(function (c) {
      var row = document.createElement("tr");
      cell(row, c.world); cell(row, c.x + ", " + c.z); cell(row, c.entities, true); cell(row, c.mobs, true); cell(row, c.items, true); cell(row, c.score, true);
      chunks.appendChild(row);
    });

    drawChart(d.msptHistory, d.tpsHistory);
    el("updated").textContent = t("updated") + ": " + new Date(d.timestamp).toLocaleTimeString();
  }
  function load() {
    fetch("/api/stats?token=" + encodeURIComponent(token), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { el("error").style.display = "none"; render(d); })
      .catch(function () { el("error").textContent = t("offline"); el("error").style.display = "block"; });
  }
  translate(); load(); setInterval(load, 5000);
  window.addEventListener("resize", load);
})();
</script>
</body>
</html>
