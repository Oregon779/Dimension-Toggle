# =========================================
#   DimensionToggle - Nachrichten (Deutsch)
# =========================================
# Diese Datei deckt nur Command-Rückmeldungen und UI-Texte ab. Klassische
# &-Farbcodes, &#RRGGBB-Hexfarben und MiniMessage-Tags (z.B. <gradient:...>)
# funktionieren alle und dürfen gemischt werden.
#
# Die Broadcast-Texte fürs Aktivieren/Deaktivieren, Wartung, Zeitplan und
# Lockdown stehen NICHT hier - die liegen direkt in der config.yml (immer
# auf Englisch, direkt neben den zugehörigen Einstellungen wie Farbe/Timing).
#
# Aktivieren mit config.yml -> language: "de"

prefix: "&8[&5DT&8]&r "

