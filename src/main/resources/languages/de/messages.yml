help-header: "<gradient:#A78BFA:#7C3AED>━━━━━</gradient> <gradient:#A78BFA:#7C3AED><bold>Dimension Toggle Hilfe</bold></gradient> <gradient:#A78BFA:#7C3AED>━━━━━</gradient>"
