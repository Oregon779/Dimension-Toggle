maintenance-teleported: "&6&l⚠ &7Du wurdest wegen Wartungsarbeiten an &f%dimension% &7entfernt."

# ---------- ZEITPLAN ----------
action-opens: "öffnet"
action-closes: "schließt"

# ---------- SPIELER-LIMIT ----------
limit-usage: "&7Nutzung: &f/dt limit <nether|end> <zahl>"
