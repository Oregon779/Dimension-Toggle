# ---------- WARTUNGSMODUS (Command-Rückmeldungen) ----------
maintenance-usage: "&7Nutzung: &f/dt maintenance <nether|end> <zeit|cancel> &8(z.B. 5m, 1h, 30s, 1h30m)"
maintenance-invalid-duration: "&c&l✘ &cUngültige Zeitangabe. Beispiele: &f5m&7, &f1h&7, &f30s&7, &f1h30m"
