invalid-usage-status-only: "&7Use &f/dt status &7to see the current status."

# Words used in formatted durations (e.g. "%duration%" for maintenance/schedule).
unit-hours: "hour(s)"
unit-minutes: "minute(s)"
unit-seconds: "second(s)"

dimension-already-enabled: "&e➤ &f%dimension% &7is already enabled."
dimension-already-disabled: "&e➤ &f%dimension% &7is already disabled."
dimension-enabled: "&a&l✔ &f%dimension% &ahas been enabled."
dimension-disabled: "&c&l✘ &f%dimension% &chas been disabled."

portal-blocked: "&c&l✘ &cAccess to &f%dimension% &cis currently disabled."
portal-locked: "&6&l⚠ &f%dimension% &6is locked &7- no new players can enter right now."
