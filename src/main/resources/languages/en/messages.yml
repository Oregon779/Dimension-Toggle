# =====================================================================
#   DimensionToggle - Messages (English)
# =====================================================================
# Command feedback and chat texts. Use %placeholder% where noted.
# MiniMessage (<gradient:...>, <#hex>, <bold>, ...) and classic & codes
# can be mixed freely.
#
# Look used throughout:
#   <#4ADE80>✔  success      <#F87171>✘  error / blocked
#   <#FBBF24>⚠  warning      <#60A5FA>ℹ  info
#   <white> = values, <gray> = text, <dark_gray> = hints
#
# The broadcast texts for opening/closing dimensions, maintenance,
# schedule and lockdown are NOT here - they live in config.yml, next to
# their timing/color/sound settings.
#
# Switch languages via config.yml -> language: "en" / "de" (add more by
# copying this folder and translating it).

# Shown in front of every single message (not in front of list lines).
prefix: "<gradient:#C084FC:#7C3AED><bold>DimensionToggle</bold></gradient> <dark_gray>» "

no-permission: "<#F87171>✘ <gray>You don't have permission to do that."
unknown-command: "<#F87171>✘ <gray>Unknown command - <white>/dt help <gray>shows all commands."
invalid-usage: "<#60A5FA>ℹ <gray>Usage: <white>/dt <editor|status|nether|end|softlock|lockdown|limit|maintenance|help|reload|checkupdate>"
invalid-usage-status-only: "<#60A5FA>ℹ <gray>Use <white>/dt status <gray>to see the current status."
players-only: "<#F87171>✘ <gray>Only a player in-game can use this."

# Words used in formatted durations (e.g. %duration%)
unit-hours: "h"
unit-minutes: "min"
unit-seconds: "s"

# ---------- Open / close ----------
dimension-already-enabled: "<#60A5FA>ℹ <white>%dimension% <gray>is already open."
dimension-already-disabled: "<#60A5FA>ℹ <white>%dimension% <gray>is already closed."
dimension-enabled: "<#4ADE80>✔ <white>%dimension% <gray>is now <#4ADE80>open<gray>."
dimension-disabled: "<#F87171>✘ <white>%dimension% <gray>is now <#F87171>closed<gray>."

# ---------- Portals ----------
portal-blocked: "<#F87171>✘ <gray>The <white>%dimension% <gray>is closed right now."
portal-locked: "<#FBBF24>⚠ <gray>The <white>%dimension% <gray>is soft-locked <dark_gray>- no new players can enter."
dimension-full: "<#FBBF24>⚠ <gray>The <white>%dimension% <gray>is full <dark_gray>(%limit% players)<gray> - try again later."
gateway-blocked: "<#F87171>✘ <gray>End gateways are closed right now."

# ---------- /dt status (lines without prefix) ----------
status-header: "<dark_gray><st>          </st></dark_gray> <gradient:#C084FC:#7C3AED><bold>DimensionToggle</bold></gradient> <dark_gray><st>          </st>"
status-nether: " <gradient:#FB923C:#DC2626><bold>Nether</bold></gradient> <dark_gray>» %status% <dark_gray>· <white>%players% <gray>players"
status-end: " <gradient:#E879F9:#8B5CF6><bold>End</bold></gradient>    <dark_gray>» %status% <dark_gray>· <white>%players% <gray>players"
status-enabled: "<#4ADE80>● Open"
status-disabled: "<#F87171>● Closed"
status-maintenance-pending: "<#FBBF24>● Maintenance <dark_gray>(closes in %seconds%s)"
status-locked: "<#FBBF24>● Soft-locked <dark_gray>(players inside can stay)"
status-footer: "<dark_gray><st>                                        </st>"

# ---------- Reload / errors ----------
reload-success: "<#4ADE80>✔ <gray>Configuration reloaded."
reload-error: "<#F87171>✘ <gray>Reload failed: <white>%error%"
error-invalid-sound: "<#F87171>✘ <gray>Invalid sound in the configuration: <white>%sound%"
error-generic: "<#F87171>✘ <gray>Something went wrong - please tell an administrator."

# ---------- Maintenance ----------
maintenance-usage: "<#60A5FA>ℹ <gray>Usage: <white>/dt maintenance <nether|end> <time|cancel> <dark_gray>(e.g. 5m, 1h, 30s, 1h30m)"
maintenance-invalid-duration: "<#F87171>✘ <gray>Invalid time - e.g. <white>5m<gray>, <white>1h<gray>, <white>30s<gray>, <white>1h30m"
maintenance-already-active: "<#FBBF24>⚠ <gray>A maintenance countdown for the <white>%dimension% <gray>is already running."
maintenance-none-active: "<#FBBF24>⚠ <gray>The <white>%dimension% <gray>has no maintenance countdown and isn't in maintenance."
maintenance-start-success: "<#4ADE80>✔ <gray>Maintenance countdown for the <white>%dimension% <gray>started <dark_gray>(<white>%duration%<dark_gray>)."
maintenance-cancel-success: "<#4ADE80>✔ <gray>Maintenance countdown for the <white>%dimension% <gray>cancelled."
maintenance-ended-success: "<#4ADE80>✔ <gray>Maintenance over - the <white>%dimension% <gray>is open again."
maintenance-teleported: "<#FBBF24>⚠ <gray>You were sent out of the <white>%dimension% <gray>because of maintenance."

# ---------- Schedule ----------
action-opens: "opens"
action-closes: "closes"

# ---------- Player limit ----------
limit-usage: "<#60A5FA>ℹ <gray>Usage: <white>/dt limit <nether|end> <number>"
limit-invalid-number: "<#F87171>✘ <gray>Please enter a valid number <dark_gray>(0 or higher)<gray>."
limit-set-success: "<#4ADE80>✔ <gray>Player limit for the <white>%dimension% <gray>set to <white>%limit%<gray>."

# ---------- Soft-lock (/dt softlock - not the same as /dt lockdown) ----------
softlock-usage: "<#60A5FA>ℹ <gray>Usage: <white>/dt softlock <nether|end>"
softlock-enabled: "<#FBBF24>⚠ <white>%dimension% <gray>soft-locked <dark_gray>- no new players, everyone inside may stay."
softlock-disabled: "<#4ADE80>✔ <white>%dimension% <gray>unlocked <dark_gray>- new players can enter again."

# ---------- Lockdown (console, the broadcast only reaches players) ----------
lockdown-activated-console: "<#F87171>⚠ <gray>Lockdown <#F87171>active <dark_gray>- all dimensions are closed."
lockdown-lifted-console: "<#4ADE80>✔ <gray>Lockdown <#4ADE80>lifted <dark_gray>- all dimensions are open again."

# ---------- /dt help (lines without prefix) ----------
help-header: "<dark_gray><st>        </st></dark_gray> <gradient:#C084FC:#7C3AED><bold>DimensionToggle</bold></gradient> <gray>Help <dark_gray><st>        </st>"
help-editor: " <#C084FC>/dt editor <dark_gray>» <gray>Click-based control panel"
help-status: " <#C084FC>/dt status <dark_gray>» <gray>Status and players of every dimension"
help-nether: " <#C084FC>/dt nether <on|off> <dark_gray>» <gray>Open/close the Nether"
help-end: " <#C084FC>/dt end <on|off> <dark_gray>» <gray>Open/close the End"
help-softlock: " <#C084FC>/dt softlock <nether|end> <dark_gray>» <gray>No new players <dark_gray>(not a lockdown)"
help-lockdown: " <#C084FC>/dt lockdown <dark_gray>» <gray>Close everything at once, again to lift"
help-limit: " <#C084FC>/dt limit <nether|end> <number> <dark_gray>» <gray>Set the player limit"
help-maintenance: " <#C084FC>/dt maintenance <nether|end> <time> <dark_gray>» <gray>Start a countdown <dark_gray>(5m, 1h, …)"
help-maintenance-cancel: " <#C084FC>/dt maintenance <nether|end> cancel <dark_gray>» <gray>Cancel/end maintenance"
help-lagmap: " <#C084FC>/dt lagmap [chat] <dark_gray>» <gray>Busiest chunks of all worlds <dark_gray>(also /lagmap)"
help-redstone: " <#C084FC>/dt redstone [chat] <dark_gray>» <gray>Chunks with the fastest redstone"
help-chunkloaders: " <#C084FC>/dt chunkloaders [chat] <dark_gray>» <gray>Chunks loaded without a player nearby"
help-web: " <#C084FC>/dt web <dark_gray>» <gray>Link to the live performance website"
help-reload: " <#C084FC>/dt reload <dark_gray>» <gray>Reload all configuration files"
help-checkupdate: " <#C084FC>/dt checkupdate <dark_gray>» <gray>Check Modrinth for a new version now"
help-help: " <#C084FC>/dt help <dark_gray>» <gray>This overview"
help-footer: "<dark_gray><st>                                        </st>"

names:
  nether: "Nether"
  end: "End"
  overworld: "Overworld"

# ---------- Update checker ----------
update-available: "<#C084FC>★ <gray>New version <#4ADE80>%version% <gray>available <dark_gray>(you have <#F87171>%current%<dark_gray>, %behind% behind)<gray> - get it on Modrinth."
update-versions-behind: "%count% version(s)"
update-versions-behind-unknown: "some versions"
update-check-triggered: "<#60A5FA>ℹ <gray>Checking Modrinth for updates <dark_gray>- the result shows up in the console."

# ---------- Lag tools ----------
chunk-hover: "<#FCD34D>▸ <gray>Click to teleport there"
teleported-chunk: "<#4ADE80>✔ <gray>Teleported to chunk <white>%x%, %z% <gray>in <white>%world%<gray>."
world-not-found: "<#F87171>✘ <gray>World <white>%world% <gray>not found."

sort-score: "lag score"
sort-entities: "entities"
sort-mobs: "mobs"
sort-items: "items"
sort-block-entities: "block entities"

lagmap-header: "<gradient:#FBBF24:#D97706><bold>Lag Map</bold></gradient> <dark_gray>» <gray>top <white>%count% <gray>chunks by <white>%sort% <dark_gray>(click = teleport)"
lagmap-line: " <#FBBF24>#%rank% <white>%world% <dark_gray>(%x%, %z%) <dark_gray>│ <#FBBF24>%score% <dark_gray>│ <gray>Ent <white>%entities% <gray>Mobs <white>%mobs% <gray>Items <white>%items% <gray>Hop <white>%hoppers% <gray>Blk <white>%blocks%"
lagmap-empty: " <gray>No loaded chunks with entities or block entities."
lagmap-cleaned: "<#4ADE80>✔ <gray>Removed <white>%items% <gray>items and <white>%mobs% <gray>mobs in chunk <white>%x%, %z% <dark_gray>(%world%)<gray>."

redstone-header: "<gradient:#F87171:#DC2626><bold>Redstone</bold></gradient> <dark_gray>» <gray>fastest chunks of the last <white>%window% s <dark_gray>(click = teleport)"
redstone-line: " <#F87171>#%rank% <white>%world% <dark_gray>(%x%, %z%) <dark_gray>│ <#F87171>%rate% <gray>updates/s"
redstone-empty: " <gray>No redstone activity measured yet <dark_gray>(the window is 20 seconds)<gray>."
redstone-alert: "<#F87171>⚠ <gray>Fast redstone in <white>%world% <dark_gray>(%x%, %z%)<gray>: <#F87171>%rate% updates/s <dark_gray>[click: teleport]"

chunkloaders-header: "<gradient:#FDE047:#CA8A04><bold>Chunk Loaders</bold></gradient> <dark_gray>» <white>%count% <gray>chunks loaded without a player nearby"
chunkloaders-line: " <#FDE047>#%rank% <white>%world% <dark_gray>(%x%, %z%) <dark_gray>│ <gray>%reason% <dark_gray>│ <white>%entities% <gray>entities"
chunkloaders-empty: " <gray>No chunks are loaded without a player nearby."
reason-force-loaded: "/forceload"
reason-plugin: "plugin: %plugins%"
reason-ender-pearl: "ender pearl"
reason-unknown: "unknown (portal, entity, …)"

# ---------- Performance website ----------
web-link: "<#4ADE80>✔ <gray>Performance website: <white><u>%url%</u> <dark_gray>(click to open)"
web-disabled: "<#F87171>✘ <gray>The performance website is off <dark_gray>(config.yml → web.enabled: true, then /dt reload)<gray>."
web-token-reset: "<#4ADE80>✔ <gray>New website token created <dark_gray>- old links no longer work."

# ---------- Optimizers ----------
item-cleaner-warning: "<#FBBF24>⚠ <gray>Items on the ground will be removed in <white>%seconds% <gray>seconds!"
item-cleaner-done: "<#4ADE80>✔ <gray>Removed <white>%count% <gray>items from the ground."
afk-view-reduced: "<#60A5FA>ℹ <gray>You're AFK - your view distance was lowered to save performance."
afk-view-restored: "<#60A5FA>ℹ <gray>Welcome back - your view distance is back to normal."
entity-cap-reached: "<#F87171>✘ <gray>Too many <white>%mob% <gray>in this chunk <dark_gray>(max %max%)<gray> - they can't breed here."
auto-performance-activated: "<#FBBF24>⚠ <gray>Server under load <dark_gray>(<#F87171>%mspt% ms/tick<dark_gray>)<gray> - auto performance mode <#FBBF24>on<gray>."
auto-performance-deactivated: "<#4ADE80>✔ <gray>Server load back to normal <dark_gray>(<#4ADE80>%mspt% ms/tick<dark_gray>)<gray> - auto performance mode <#4ADE80>off<gray>."

# ---------- Chat input (own intervals in the editor) ----------
chat-input-prompt: "<#FCD34D>✎ <gray>Type the new time for <white>%what% <gray>in the chat <dark_gray>(now: <white>%current%<dark_gray>)"
chat-input-hint: "<dark_gray>   e.g. <white>15m<dark_gray>, <white>2h<dark_gray>, <white>1h30m <dark_gray>(1 min - 24 h) · <white>0 <dark_gray>= off · <white>cancel <dark_gray>= abort"
chat-input-invalid: "<#F87171>✘ <gray>Not a valid time - allowed are 1 minute to 24 hours <dark_gray>(e.g. 15m, 2h)<gray>, <white>0 <gray>for off or <white>cancel<gray>."
chat-input-cancelled: "<#60A5FA>ℹ <gray>Input cancelled - nothing was changed."
chat-input-timeout: "<#60A5FA>ℹ <gray>No input for 30 seconds - nothing was changed."
chat-input-set: "<#4ADE80>✔ <white>%what% <gray>set to <white>%value%<gray>."
chat-input-off-word: "off"
chat-input-what-item-cleaner: "Item cleaner"
chat-input-what-mob: "%mob% cleanup (%dimension%)"

